- name: Add Jenkins repository (Force Trusted)
  apt_repository:
    repo: "deb [trusted=yes] https://pkg.jenkins.io/debian-stable binary/"
    state: present
    filename: jenkins
    update_cache: yes

- name: Install Jenkins
  apt:
    name: jenkins
    state: present

- name: Ensure Jenkins is started
  service:
    name: jenkins
    state: started
    enabled: yes
- name: Wait for Jenkins to start on port 8080
  wait_for:
    host: localhost
    port: 8080
    delay: 5
    timeout: 300